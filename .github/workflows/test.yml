name: Test

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "vitest.config.ts"
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether the matrix needs to run. On push the trigger is already
  # path-filtered, so this is only meaningful for pull_request, where the
  # workflow must run on every PR (so the required Test check always reports)
  # but the expensive matrix should only run when test-relevant files change.
  # Uses plain git rather than a third-party changed-files action.
  changes:
    name: changes
    runs-on: tenki-standard-small-2c-4g
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect test-relevant changes
        id: filter
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [ -z "${base}" ]; then
            # Not a pull_request (push / workflow_dispatch): the push trigger is
            # already path-filtered, so run the matrix.
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed=$(git diff --name-only "${base}...${head}" -- \
            .github/workflows/test.yml src test package.json package-lock.json \
            tsconfig.json tsup.config.ts vitest.config.ts)
          if [ -n "${changed}" ]; then
            echo "Test-relevant files changed:"
            echo "${changed}"
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No test-relevant files changed."
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: node ${{ matrix.node }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: tenki-standard-small-2c-4g
    strategy:
      fail-fast: false
      matrix:
        # Node 24 (current LTS, what the publish workflow uses). Node 22 is a
        # supported runtime target (engines >=22) but is not CI-gated yet: its
        # two real-HTTP/2 refused-stream integration tests trip a 10s setup-hook
        # timeout on the slower runtime — a test-harness margin, not a runtime
        # incompatibility. Re-add "22" here once that hook timeout is relaxed
        # upstream in tenki.app (which also de-flakes 24, where it passes by a
        # thin margin).
        node: ["24"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Aggregate gate: this job's name is the required status check ("Test"). It
  # runs on every PR and reports once. It passes when no test-relevant files
  # changed (the matrix was skipped) and otherwise only when the matrix passed.
  test:
    name: Test
    runs-on: tenki-standard-small-2c-4g
    needs: [changes, build]
    if: always()
    steps:
      - name: Require the matrix to pass when it ran
        run: |
          set -euo pipefail
          changes_result='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          build_result='${{ needs.build.result }}'
          echo "changes=${changes_result} code=${code} build=${build_result}"
          if [ "${changes_result}" != "success" ]; then
            echo "::error::change detection did not succeed"
            exit 1
          fi
          if [ "${code}" != "true" ]; then
            echo "No test-relevant files changed; nothing to test."
            exit 0
          fi
          if [ "${build_result}" != "success" ]; then
            echo "::error::the node test matrix did not pass"
            exit 1
          fi
