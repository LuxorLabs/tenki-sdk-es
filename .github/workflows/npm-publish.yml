name: Publish

# Real publishes happen only on a v* tag push. workflow_dispatch is a dry run:
# it builds and checks the package but never publishes, so who can release is
# exactly who can push a v* tag (enforced by a tag ruleset), not who can click
# "Run workflow".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Always runs. On workflow_dispatch this is the whole thing (a dry run). On a
  # v* tag push it also gates the publish job: the tag has to match the packaged
  # version and the build + checks have to pass before anything is published.
  # The packed tarball it uploads is exactly what gets published, so the bytes
  # that reach npm are the bytes that were tested here.
  build:
    name: Build and check
    runs-on: tenki-standard-small-2c-4g
    outputs:
      published: ${{ steps.version.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p 'require("./package.json").version')
          echo "tag=${tag} package-version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Check if version is already published
        id: version
        run: |
          set -euo pipefail
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published, skipping"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pack
        run: npm pack

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish ./*.tgz --access public --dry-run

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 1
          if-no-files-found: error

  # Real publish. Only a v* tag push reaches this job, and it is the only one
  # bound to the npm-publish environment / OIDC trusted publisher. It runs no
  # install or build before the publish: it downloads the exact tarball the
  # build job packed and tested, and publishes that.
  publish:
    name: Publish to npm
    needs: build
    if: ${{ github.event_name == 'push' && needs.build.outputs.published == 'false' }}
    runs-on: tenki-standard-small-2c-4g
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      - name: Publish to npm
        run: npm publish ./*.tgz --access public
