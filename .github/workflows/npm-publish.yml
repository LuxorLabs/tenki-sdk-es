name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run checks and package publish dry-run without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: tenki-standard-small-2c-4g
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check LICENSE is packaged
        run: |
          set -euo pipefail
          if ! npm pack --dry-run --json | node -e 'const [p] = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(p.files.some((f) => f.path === "LICENSE") ? 0 : 1)'; then
            echo "::error::npm package does not include LICENSE"
            exit 1
          fi

      - name: Publish if version is new
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')

          PUBLISHED=false
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            PUBLISHED=true
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            npm pack --dry-run
            if [ "${PUBLISHED}" = "true" ]; then
              echo "${NAME}@${VERSION} already published, skipping publish dry-run"
              exit 0
            fi
            npm publish --access public --dry-run
            exit 0
          fi

          if [ "${PUBLISHED}" = "true" ]; then
            echo "${NAME}@${VERSION} already published, skipping"
            exit 0
          fi

          npm publish --access public
